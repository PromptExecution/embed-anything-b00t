[package]
name = "processors-rs"
version = "0.7.2"
edition = "2021"
license = "Apache-2.0"
description = "Document processors for embed_anything"
repository = "https://github.com/PromptExecution/embed-anything-b00t"
authors = ["Akshay Ballal <arballal95@gmail.com>"]
readme = "README.md"

[dependencies]
# HTTP Client
reqwest = { version = "0.12.15", default-features = false, features = ["json", "blocking", "gzip", "brotli", "deflate"] }

# Natural Language Processing
text-splitter = { version= "0.25.1", features=["tokenizers", "markdown"] }

# Error Handling
anyhow = "1.0.98"

# HTML processing
htmd = "0.1.6"
regex = "1.10.3"

# PDF processing
pdf-extract = "0.9.0"
docx-parser = "0.1.1"
docx-rust = "=0.1.8"
pdf2image = "0.1.3"
image = "0.25.6"
thiserror = "2.0.12"
tempfile = "3.19.1"
# Video processing (uses external ffmpeg CLI)

[dev-dependencies]
tempdir = "0.3.7"

[features]
default = []
video = []